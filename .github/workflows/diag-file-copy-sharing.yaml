# Temporary diagnostic workflow; not intended to be merged.
on:
  push:
    branches: [diag/file-copy-sharing]

name: diag-file-copy-sharing

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Run diagnostics
        run: Rscript .github/diag/file-copy-sharing.R
